name: Construire JaugeClaude.exe

on:
  push:
    branches: [main, application-autonome]
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction (C#, .NET Framework 4.8)
        run: dotnet build csharp/JaugeClaude.csproj -c Release
      - name: Taille
        shell: bash
        run: ls -l csharp/bin/Release/net48/JaugeClaude.exe
      - uses: actions/upload-artifact@v4
        with:
          name: JaugeClaude
          path: csharp/bin/Release/net48/JaugeClaude.exe
