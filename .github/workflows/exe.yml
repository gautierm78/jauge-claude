name: Construire JaugeClaude.exe

# Chaque construction se fait ici, en public, à partir du code du dépôt :
# le journal montre exactement ce qui est compilé, et l'empreinte SHA-256 du résultat.
#
# Publication automatique : créez une version (Releases > Draft a new release, tag vX.Y.Z)
# sans fichier ; cette tâche y ajoute JaugeClaude.exe, son empreinte et le paquet Store.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Numéro de version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then v="${{ github.event.release.tag_name }}"; v="${v#v}";
          else v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' csharp/JaugeClaude.csproj); fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version : $v"

      - name: Construction (C#, .NET Framework 4.8)
        run: dotnet build csharp/JaugeClaude.csproj -c Release -p:Version=${{ steps.v.outputs.version }}

      - name: Empreinte SHA-256
        shell: bash
        run: |
          mkdir -p sortie
          cp csharp/bin/Release/net48/JaugeClaude.exe sortie/
          cd sortie
          ls -l JaugeClaude.exe
          sha256sum JaugeClaude.exe | tee JaugeClaude.exe.sha256

      - name: Paquet Microsoft Store (MSIX)
        shell: powershell
        run: >
          .\store\construire-msix.ps1 -Exe sortie\JaugeClaude.exe -Version "${{ steps.v.outputs.version }}"
          -Nom "${{ vars.MSIX_NAME || 'JaugeClaude' }}"
          -Editeur "${{ vars.MSIX_PUBLISHER || 'CN=JaugeClaude' }}"
          -EditeurAffiche "${{ vars.MSIX_PUBLISHER_DISPLAY || 'Jauge Claude' }}"
          -Sortie sortie\JaugeClaude-Store.msix

      - uses: actions/upload-artifact@v4
        with:
          name: JaugeClaude
          path: sortie/

      - name: Ajouter les fichiers à la version
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sortie/JaugeClaude.exe sortie/JaugeClaude.exe.sha256 --clobber
